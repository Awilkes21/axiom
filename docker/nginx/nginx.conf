events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format json escape=json
    '{"timestamp":"$time_iso8601","service":"nginx","remote_addr":"$remote_addr",'
    '"method":"$request_method","path":"$uri","status":$status,'
    '"request_time":$request_time,"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status"}';

  access_log /var/log/nginx/access.log json;
  error_log /var/log/nginx/error.log warn;

  upstream axiom_frontend {
    server frontend:3000;
  }

  upstream axiom_backend {
    server backend:4000;
  }

  upstream axiom_websocket {
    server websocket:5000;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 80;
    server_name _;

    location = /health {
      add_header Content-Type application/json;
      return 200 '{"status":"ok","service":"nginx"}';
    }

    location /api/ {
      proxy_pass http://axiom_backend/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
      proxy_pass http://axiom_websocket;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 1h;
    }

    location / {
      proxy_pass http://axiom_frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/local-dev.crt;
    ssl_certificate_key /etc/nginx/certs/local-dev.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location = /health {
      add_header Content-Type application/json;
      return 200 '{"status":"ok","service":"nginx"}';
    }

    location /api/ {
      proxy_pass http://axiom_backend/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
      proxy_pass http://axiom_websocket;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 1h;
    }

    location / {
      proxy_pass http://axiom_frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
